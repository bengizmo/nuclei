# Docker Compose for Nuclei with network discovery and auto-profiling
version: '3.8'

services:
  nuclei:
    build: .
    container_name: nuclei-scanner
    volumes:
      - ./results:/home/nuclei/results
      - ./scripts:/home/nuclei/scripts
      - ./discovery:/home/nuclei/discovery
      - ./logs:/home/nuclei/logs
      - ./critical-hosts.txt:/home/nuclei/critical-hosts.txt:ro
    environment:
      - HOME_ASSISTANT_API_TOKEN=${HOME_ASSISTANT_API_TOKEN}
      - PDCP_API_KEY=${PDCP_API_KEY}
      - OLLAMA_API=http://192.168.10.249:11434/v1
    network_mode: host
    cap_add:
      - NET_ADMIN  # Required for network operations
      - NET_RAW    # Required for NMAP
    restart: unless-stopped
    command: sh -c "
      /home/nuclei/scripts/create-vlans-manual.sh &&
      /home/nuclei/scripts/network-discovery.sh &
      sleep infinity
      "