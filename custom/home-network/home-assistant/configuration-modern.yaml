# Nuclei Scanner Integration for Home Assistant 2025
# Best practices implementation

# Input helpers for persistent, editable state
input_text:
  nuclei_status:
    name: Nuclei Scanner Status
    initial: idle
    icon: mdi:shield-search

input_datetime:
  nuclei_last_scan:
    name: Last Security Scan
    has_date: true
    has_time: true
    icon: mdi:clock-outline

input_number:
  nuclei_findings:
    name: Security Findings
    min: 0
    max: 999
    step: 1
    icon: mdi:alert-circle
    unit_of_measurement: "issues"

  nuclei_critical_count:
    name: Critical Findings
    min: 0
    max: 99
    step: 1
    icon: mdi:alert-octagon
    unit_of_measurement: "critical"

  nuclei_hosts_scanned:
    name: Hosts Scanned
    min: 0
    max: 999
    step: 1
    icon: mdi:server-network
    unit_of_measurement: "hosts"

# Template sensor that combines the inputs
template:
  - sensor:
      - name: "Nuclei Security Scanner"
        unique_id: nuclei_scanner_main
        state: "{{ states('input_text.nuclei_status') }}"
        icon: >-
          {% if states('input_text.nuclei_status') == 'alert' %}
            mdi:shield-alert
          {% elif states('input_text.nuclei_status') == 'scanning' %}
            mdi:shield-sync
          {% else %}
            mdi:shield-check
          {% endif %}
        attributes:
          last_scan: "{{ states('input_datetime.nuclei_last_scan') }}"
          findings_count: "{{ states('input_number.nuclei_findings') | int }}"
          critical_count: "{{ states('input_number.nuclei_critical_count') | int }}"
          hosts_scanned: "{{ states('input_number.nuclei_hosts_scanned') | int }}"
          status_message: >-
            {% set findings = states('input_number.nuclei_findings') | int %}
            {% set critical = states('input_number.nuclei_critical_count') | int %}
            {% if states('input_text.nuclei_status') == 'alert' %}
              Found {{ findings }} issues ({{ critical }} critical)
            {% elif states('input_text.nuclei_status') == 'scanning' %}
              Scan in progress...
            {% else %}
              No issues found
            {% endif %}

# REST API configuration for receiving updates
rest_command:
  update_nuclei_status:
    url: "http://localhost:8123/api/states/input_text.nuclei_status"
    method: POST
    headers:
      authorization: "Bearer {{ states('input_text.nuclei_api_token') }}"
      content-type: "application/json"
    payload: '{"state": "{{ status }}"}'

# Automations
automation:
  - alias: "Nuclei Security Alert"
    id: nuclei_security_alert
    trigger:
      - platform: state
        entity_id: input_text.nuclei_status
        to: "alert"
    action:
      - service: notify.mobile_app_bens_iphone_15
        data:
          title: "🔒 Security Alert"
          message: >-
            Nuclei found {{ states('input_number.nuclei_findings') }} issues 
            ({{ states('input_number.nuclei_critical_count') }} critical)
          data:
            push:
              badge: "{{ states('input_number.nuclei_findings') }}"
              sound: "critical"
            action_data:
              entity_id: sensor.nuclei_security_scanner

  - alias: "Nuclei Scan Complete"
    id: nuclei_scan_complete
    trigger:
      - platform: state
        entity_id: input_text.nuclei_status
        from: "scanning"
    condition:
      - condition: template
        value_template: "{{ trigger.to_state.state != 'scanning' }}"
    action:
      - service: notify.mobile_app_bens_iphone_15
        data:
          title: "✅ Security Scan Complete"
          message: >-
            {% if states('input_text.nuclei_status') == 'alert' %}
            Found {{ states('input_number.nuclei_findings') }} security issues
            {% else %}
            No security issues detected
            {% endif %}

  - alias: "Nuclei Daily Scan Trigger"
    id: nuclei_daily_scan
    trigger:
      - platform: time
        at: "03:00:00"
    action:
      - service: shell_command.run_nuclei_scan

# Shell commands for triggering scans
shell_command:
  run_nuclei_scan: "ssh nas 'docker exec nuclei-scanner /home/nuclei/scripts/scan-with-ha.sh'"
  run_nuclei_quick_scan: "ssh nas 'docker exec nuclei-scanner /home/nuclei/scripts/quick-network-overview.sh'"

# Scripts for manual control
script:
  nuclei_manual_scan:
    alias: "Run Security Scan Now"
    icon: mdi:shield-search
    sequence:
      - service: input_text.set_value
        data:
          entity_id: input_text.nuclei_status
          value: "scanning"
      - service: shell_command.run_nuclei_scan

  nuclei_reset_status:
    alias: "Reset Scanner Status"
    icon: mdi:restart
    sequence:
      - service: input_text.set_value
        data:
          entity_id: input_text.nuclei_status
          value: "idle"
      - service: input_number.set_value
        data:
          entity_id: input_number.nuclei_findings
          value: 0

