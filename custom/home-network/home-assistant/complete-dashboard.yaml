# Complete Home Assistant Dashboard for Nuclei Scanner with AI Summary
type: vertical-stack
title: Network Security Scanner
cards:
  # Main status card
  - type: custom:mushroom-entity-card
    entity: sensor.nuclei_scanner
    name: Nuclei Scanner
    icon_color: |
      {% if is_state('sensor.nuclei_scanner', 'scanning') %}
        blue
      {% elif is_state('sensor.nuclei_scanner', 'alert') %}
        red
      {% else %}
        green
      {% endif %}
    primary_info: name
    secondary_info: state
    tap_action:
      action: more-info

  # AI Summary card
  - type: markdown
    title: AI Analysis
    icon: mdi:robot
    content: |
      **Summary:** {{ states('sensor.nuclei_scanner_summary') }}
      
      *Generated: {{ relative_time(state_attr('sensor.nuclei_scanner_summary', 'generated_at')) }} ago*

  # Statistics cards
  - type: horizontal-stack
    cards:
      - type: custom:mushroom-entity-card
        entity: sensor.nuclei_scanner_findings
        name: Vulnerabilities
        icon: mdi:bug
        icon_color: |
          {% if states('sensor.nuclei_scanner_findings')|int > 0 %}
            red
          {% else %}
            green
          {% endif %}
        primary_info: name
        secondary_info: state
      
      - type: custom:mushroom-entity-card
        entity: sensor.nuclei_scanner_hosts
        name: Hosts Scanned
        icon: mdi:server-network
        icon_color: blue
        primary_info: name
        secondary_info: state

  # Severity breakdown (if available)
  - type: conditional
    conditions:
      - entity: sensor.nuclei_scanner_summary
        state_not: "No scan results available"
    card:
      type: entities
      title: Vulnerability Breakdown
      entities:
        - type: attribute
          entity: sensor.nuclei_scanner_summary
          attribute: critical_count
          name: Critical
          icon: mdi:alert-circle
        - type: attribute
          entity: sensor.nuclei_scanner_summary
          attribute: high_count
          name: High
          icon: mdi:alert
        - type: attribute
          entity: sensor.nuclei_scanner_summary
          attribute: medium_count
          name: Medium
          icon: mdi:alert-outline
        - type: attribute
          entity: sensor.nuclei_scanner_summary
          attribute: low_count
          name: Low
          icon: mdi:information-outline

  # Status and timing
  - type: entities
    entities:
      - entity: sensor.nuclei_scanner_status
        name: Status
      - entity: sensor.nuclei_scanner_last_scan
        name: Last Scan
        format: relative

  # Action buttons
  - type: horizontal-stack
    cards:
      - type: button
        name: Quick Scan
        icon: mdi:play
        tap_action:
          action: call-service
          service: shell_command.run_nuclei_ai_scan
      
      - type: button
        name: Full VLAN Scan
        icon: mdi:shield-search
        tap_action:
          action: call-service
          service: shell_command.run_nuclei_full_scan
      
      - type: button
        name: Regenerate Summary
        icon: mdi:robot
        tap_action:
          action: call-service
          service: shell_command.regenerate_ai_summary

# Shell commands
shell_command:
  run_nuclei_ai_scan: 'ssh ben@192.168.10.163 "/usr/local/bin/docker exec nuclei-scanner sh /home/nuclei/scripts/scan-with-ai-summary.sh"'
  run_nuclei_full_scan: 'ssh ben@192.168.10.163 "/usr/local/bin/docker exec nuclei-scanner sh /home/nuclei/scripts/full-vlan-scan.sh"'
  regenerate_ai_summary: 'ssh ben@192.168.10.163 "/usr/local/bin/docker exec nuclei-scanner sh /home/nuclei/scripts/generate-ai-summary.sh"'

# Automations with AI summary
automation:
  - alias: "Nuclei Daily Scan with AI"
    trigger:
      - platform: time
        at: "03:00:00"
    action:
      - service: shell_command.run_nuclei_ai_scan
  
  - alias: "Nuclei Alert with AI Summary"
    trigger:
      - platform: state
        entity_id: sensor.nuclei_scanner_status
        to: "alert"
    action:
      - delay:
          seconds: 5  # Wait for AI summary to generate
      - service: notify.mobile_app_ben_s_iphone_15
        data:
          title: "🚨 Security Alert"
          message: |
            {{ states('sensor.nuclei_scanner_summary') }}
            
            Found: {{ states('sensor.nuclei_scanner_findings') }} vulnerabilities
          data:
            push:
              sound:
                name: "alarm.caf"
              critical: 1
              volume: 1.0
            actions:
              - action: "VIEW_DASHBOARD"
                title: "View Details"

# Template sensor for enhanced summary display
template:
  - sensor:
      - name: "Nuclei Security Status"
        unique_id: nuclei_security_status
        state: >
          {% if is_state('sensor.nuclei_scanner_status', 'scanning') %}
            Scanning Network...
          {% elif state_attr('sensor.nuclei_scanner_summary', 'critical_count')|int > 0 %}
            🔴 Critical Issues Found
          {% elif state_attr('sensor.nuclei_scanner_summary', 'high_count')|int > 0 %}
            🟠 High Risk Issues
          {% elif state_attr('sensor.nuclei_scanner_summary', 'medium_count')|int > 0 %}
            🟡 Medium Risk Issues
          {% elif is_state('sensor.nuclei_scanner_status', 'ok') %}
            🟢 Network Secure
          {% else %}
            Status Unknown
          {% endif %}
        attributes:
          summary: "{{ states('sensor.nuclei_scanner_summary') }}"
          last_scan: "{{ states('sensor.nuclei_scanner_last_scan') }}"
          icon: mdi:shield-check