# Docker Compose for Nuclei Multi-VLAN Home Network Scanning
# To be deployed on Synology NAS (192.168.10.163)

version: '3.8'

services:
  nuclei:
    image: projectdiscovery/nuclei:latest
    container_name: nuclei-scanner
    cap_add:
      - NET_ADMIN  # Required for multiple VLANs
    privileged: true  # May be needed for VLAN access
    volumes:
      - ./templates:/home/nuclei/nuclei-templates
      - ./results:/home/nuclei/results
      - ./config:/home/nuclei/.config/nuclei
      - ./scripts:/home/nuclei/scripts
      - ./critical-hosts.txt:/home/nuclei/critical-hosts.txt:ro
    environment:
      - HOME_ASSISTANT_API_TOKEN=${HOME_ASSISTANT_API_TOKEN}
      - PDCP_API_KEY=b1e5b881-f0b7-4cf8-95b3-05de6b978052
      - OLLAMA_API=http://192.168.10.249:11434/v1
    networks:
      vlan_default:
        ipv4_address: 192.168.10.200
      vlan_iot:
        ipv4_address: 192.168.14.200
      vlan_guest:
        ipv4_address: 192.168.5.200
      vlan_clients:
        ipv4_address: 192.168.6.200
    restart: unless-stopped
    command: /home/nuclei/scripts/ha-webhook-update.sh

networks:
  vlan_default:
    driver: macvlan
    driver_opts:
      parent: eth0.1
    ipam:
      config:
        - subnet: 192.168.10.0/24
          gateway: 192.168.10.1
  vlan_iot:
    driver: macvlan
    driver_opts:
      parent: eth0.2
    ipam:
      config:
        - subnet: 192.168.14.0/24
          gateway: 192.168.14.1
  vlan_guest:
    driver: macvlan
    driver_opts:
      parent: eth0.3
    ipam:
      config:
        - subnet: 192.168.5.0/24
          gateway: 192.168.5.1
  vlan_clients:
    driver: macvlan
    driver_opts:
      parent: eth0.4
    ipam:
      config:
        - subnet: 192.168.6.0/24
          gateway: 192.168.6.1